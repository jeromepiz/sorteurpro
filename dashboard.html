<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SorteurPro — Tableau de bord</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --blue: #1a3a5c; --blue-mid: #2e6da4; --blue-light: #e8f0f8;
  --green: #155724; --green-bg: #d4edda; --green-border: #a5d6a7;
  --red: #7d1f1f; --red-bg: #f8d7da; --red-border: #f5c6cb;
  --orange: #7d3c00; --orange-bg: #fff3cd; --orange-border: #ffc107;
  --gray: #6c757d; --gray-bg: #f8f9fa; --gray-border: #dee2e6;
  --text: #212529; --text-muted: #6c757d;
  --radius: 10px; --radius-lg: 14px;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
}
html, body { background: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); min-height: 100vh; }

/* ─── HEADER ─── */
.header { background: var(--blue); color: white; padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-left { display: flex; align-items: center; gap: 12px; }
.header h1 { font-size: 18px; font-weight: 700; }
.header .sub { font-size: 12px; opacity: 0.65; margin-top: 1px; }
.live-dot { width: 8px; height: 8px; background: #4caf50; border-radius: 50%; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.live-label { font-size: 12px; opacity: 0.8; }

/* ─── TOOLBAR ─── */
.toolbar { background: white; border-bottom: 1px solid var(--gray-border); padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.toolbar label { font-size: 13px; color: var(--text-muted); }
.toolbar input[type=date] { border: 1px solid var(--gray-border); border-radius: var(--radius); padding: 7px 12px; font-size: 14px; cursor: pointer; background: white; }
.toolbar input[type=date]:focus { outline: none; border-color: var(--blue-mid); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s; text-decoration: none; }
.btn:active { opacity: 0.8; }
.btn-primary { background: var(--blue); color: white; }
.btn-green { background: #1b5e20; color: white; }
.btn-red { background: var(--red); color: white; }
.btn-gray { background: var(--gray-bg); color: var(--text); border: 1px solid var(--gray-border); }
.btn-refresh { background: var(--blue-light); color: var(--blue); }
.ml-auto { margin-left: auto; }

/* ─── LAYOUT ─── */
.main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }

/* ─── STAT CARDS ─── */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
@media(max-width:900px){ .stats-grid { grid-template-columns: repeat(2,1fr); } }
@media(max-width:500px){ .stats-grid { grid-template-columns: 1fr 1fr; } }
.stat-card { background: white; border-radius: var(--radius-lg); padding: 18px 20px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; }
.stat-icon { font-size: 32px; flex-shrink: 0; }
.stat-val { font-size: 30px; font-weight: 800; line-height: 1; }
.stat-lbl { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
.stat-card.blue .stat-val { color: var(--blue); }
.stat-card.green .stat-val { color: #1b5e20; }
.stat-card.orange .stat-val { color: #e65100; }
.stat-card.red .stat-val { color: var(--red); }

/* ─── GRILLE DEUX COLONNES ─── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
@media(max-width:900px){ .two-col { grid-template-columns: 1fr; } }

/* ─── PANELS ─── */
.panel { background: white; border-radius: var(--radius-lg); box-shadow: var(--shadow); overflow: hidden; }
.panel-header { padding: 14px 18px; border-bottom: 1px solid var(--gray-border); display: flex; align-items: center; justify-content: space-between; }
.panel-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.panel-count { font-size: 12px; background: var(--blue-light); color: var(--blue); padding: 2px 8px; border-radius: 99px; font-weight: 600; }
.panel-body { padding: 0; }

/* ─── TOURNÉES EN COURS ─── */
.tournee-row { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--gray-bg); transition: background 0.1s; }
.tournee-row:last-child { border-bottom: none; }
.tournee-row:hover { background: var(--gray-bg); }
.agent-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--blue-light); color: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.tournee-info { flex: 1; min-width: 0; }
.tournee-agent { font-size: 13px; font-weight: 600; }
.tournee-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.tournee-right { text-align: right; flex-shrink: 0; }
.progress-mini { width: 100px; height: 6px; background: var(--gray-bg); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.progress-mini-fill { height: 100%; border-radius: 99px; background: var(--blue); transition: width 0.4s; }
.progress-mini-fill.done { background: #1b5e20; }
.badge { display: inline-flex; align-items: center; font-size: 11px; padding: 3px 8px; border-radius: 99px; font-weight: 600; }
.badge-en-cours { background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange-border); }
.badge-terminee { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.badge-anomalie { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }

/* ─── ANOMALIES ─── */
.anomalie-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--gray-bg); }
.anomalie-row:last-child { border-bottom: none; }
.anomalie-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
.anomalie-info { flex: 1; min-width: 0; }
.anomalie-adresse { font-size: 13px; font-weight: 600; }
.anomalie-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.anomalie-comment { font-size: 12px; color: var(--orange); margin-top: 4px; background: var(--orange-bg); padding: 4px 8px; border-radius: 6px; }
.anomalie-time { font-size: 11px; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }

/* ─── HISTORIQUE ─── */
.histo-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.histo-table th { background: var(--gray-bg); padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); border-bottom: 1px solid var(--gray-border); }
.histo-table td { padding: 11px 14px; border-bottom: 1px solid var(--gray-bg); vertical-align: middle; }
.histo-table tr:last-child td { border-bottom: none; }
.histo-table tr:hover td { background: var(--gray-bg); }
.duration { font-weight: 600; color: var(--blue); }

/* ─── EMPTY STATE ─── */
.empty { text-align: center; padding: 32px 20px; color: var(--text-muted); font-size: 13px; }
.empty-icon { font-size: 36px; margin-bottom: 8px; }

/* ─── SPINNER ─── */
.spinner-wrap { display: flex; justify-content: center; padding: 40px; }
.spinner { width: 36px; height: 36px; border: 3px solid var(--gray-border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── TOAST ─── */
.toast { position: fixed; bottom: 24px; right: 24px; background: #1b5e20; color: white; padding: 12px 20px; border-radius: var(--radius); font-size: 14px; font-weight: 500; opacity: 0; transition: opacity 0.3s; z-index: 999; pointer-events: none; }
.toast.show { opacity: 1; }

/* ─── EXPORT PDF ─── */
@media print {
  .header, .toolbar, .btn, .live-dot, .live-label { display: none !important; }
  body { background: white; }
  .panel { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
  .main { padding: 0; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span style="font-size:24px;">🗑️</span>
    <div>
      <h1>SorteurPro — Tableau de bord</h1>
      <div class="sub">Suivi des tournées en temps réel</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="live-dot"></div>
    <span class="live-label">En direct</span>
  </div>
</div>

<div class="toolbar">
  <label>Date :</label>
  <input type="date" id="filter-date">
  <button class="btn btn-refresh" onclick="loadDashboard()">🔄 Actualiser</button>
  <div class="ml-auto" style="display:flex;gap:8px;flex-wrap:wrap;">
    <button class="btn btn-green" onclick="exportExcel()">📥 Export Excel</button>
    <button class="btn btn-red" onclick="exportPDF()">📄 Export PDF</button>
  </div>
</div>

<div class="main">
  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card blue"><div class="stat-icon">🚛</div><div><div class="stat-val" id="s-en-cours">—</div><div class="stat-lbl">Tournées en cours</div></div></div>
    <div class="stat-card green"><div class="stat-icon">✅</div><div><div class="stat-val" id="s-terminees">—</div><div class="stat-lbl">Tournées terminées</div></div></div>
    <div class="stat-card orange"><div class="stat-icon">📍</div><div><div class="stat-val" id="s-adresses">—</div><div class="stat-lbl">Adresses traitées</div></div></div>
    <div class="stat-card red"><div class="stat-icon">⚠️</div><div><div class="stat-val" id="s-anomalies">—</div><div class="stat-lbl">Anomalies signalées</div></div></div>
  </div>

  <!-- TEMPS RÉEL + ANOMALIES -->
  <div class="two-col">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">🚛 Tournées du jour <span class="panel-count" id="count-tournees">0</span></div>
      </div>
      <div class="panel-body" id="list-tournees">
        <div class="spinner-wrap"><div class="spinner"></div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">⚠️ Anomalies <span class="panel-count" id="count-anomalies">0</span></div>
      </div>
      <div class="panel-body" id="list-anomalies">
        <div class="spinner-wrap"><div class="spinner"></div></div>
      </div>
    </div>
  </div>

  <!-- HISTORIQUE COMPLET -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">📋 Historique des tournées</div>
    </div>
    <div class="panel-body" style="overflow-x:auto;">
      <table class="histo-table" id="histo-table">
        <thead>
          <tr>
            <th>Agent</th>
            <th>Tournée</th>
            <th>Date</th>
            <th>Début</th>
            <th>Fin</th>
            <th>Durée</th>
            <th>Adresses</th>
            <th>Anomalies</th>
            <th>Statut</th>
          </tr>
        </thead>
        <tbody id="histo-body">
          <tr><td colspan="9"><div class="spinner-wrap"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ANOMALY_LABELS = {
  bac_absent: '🗑️ Bac non sorti',
  acces_bloque: '🚧 Accès bloqué',
  bac_endommage: '🔨 Bac endommagé',
  bac_plein: '🔴 Bac trop plein',
  mauvais_tri: '♻️ Mauvais tri',
  bac_non_rentre: '↩️ Non rentré (AM)',
  adresse_absente: '❓ Adresse introuvable',
  autre: '📝 Autre'
};

function fmt(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function fmtDuree(ms) {
  if (!ms) return '—';
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60);
  if (h > 0) return `${h}h ${m % 60}min`;
  return `${m} min`;
}
function initials(name) {
  return name.split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2);
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── CHARGEMENT DASHBOARD ───
async function loadDashboard() {
  const date = document.getElementById('filter-date').value;
  const url = '/api/dashboard' + (date ? `?date=${date}` : '');

  try {
    const res = await fetch(url);
    const data = await res.json();
    renderStats(data.stats);
    renderTournees(data.sessions, data.validations);
    renderAnomalies(data.anomalies);
    renderHistorique(data.sessions, data.validations);
  } catch(e) {
    console.error('Erreur dashboard:', e);
  }
}

function renderStats(stats) {
  document.getElementById('s-en-cours').textContent   = stats.tourneesEnCours;
  document.getElementById('s-terminees').textContent  = stats.tourneesTerminees;
  document.getElementById('s-adresses').textContent   = stats.totalAdresses;
  document.getElementById('s-anomalies').textContent  = stats.totalAnomalies;
}

function renderTournees(sessions, validations) {
  const el = document.getElementById('list-tournees');
  document.getElementById('count-tournees').textContent = sessions.length;

  if (!sessions.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🚛</div>Aucune tournée pour cette période</div>';
    return;
  }

  // Trie : en cours d'abord, puis par heure de début
  const sorted = [...sessions].sort((a, b) => {
    if (a.status !== b.status) return a.status === 'en_cours' ? -1 : 1;
    return new Date(b.startTime) - new Date(a.startTime);
  });

  el.innerHTML = sorted.map(s => {
    const vals = validations.filter(v => v.agent === s.agent && v.tourneeId === s.tourneeId && v.startTime === s.startTime);
    const total = s.tourneeData ? s.tourneeData.addresses.length : (s.total || '?');
    const done = vals.length;
    const pct = total && total !== '?' ? Math.round(done / total * 100) : 0;
    const anomCount = vals.filter(v => v.anomalie).length;
    const badge = s.status === 'terminee'
      ? `<span class="badge badge-terminee">✓ Terminée</span>`
      : `<span class="badge badge-en-cours">⏳ En cours</span>`;
    const anomBadge = anomCount > 0 ? `<span class="badge badge-anomalie" style="margin-left:4px;">⚠️ ${anomCount}</span>` : '';

    return `
      <div class="tournee-row">
        <div class="agent-avatar">${initials(s.agent)}</div>
        <div class="tournee-info">
          <div class="tournee-agent">${s.agent}</div>
          <div class="tournee-meta">${s.tourneeId} · Début ${fmt(s.startTime)}${s.endTime ? ' · Fin ' + fmt(s.endTime) : ''}</div>
        </div>
        <div class="tournee-right">
          <div>${badge}${anomBadge}</div>
          <div class="progress-mini" style="margin-left:auto;margin-top:6px;">
            <div class="progress-mini-fill ${s.status==='terminee'?'done':''}" style="width:${pct}%"></div>
          </div>
          <div style="font-size:11px;color:var(--text-muted);text-align:right;margin-top:2px;">${done} / ${total} adresses</div>
        </div>
      </div>`;
  }).join('');
}

function renderAnomalies(anomalies) {
  const el = document.getElementById('list-anomalies');
  document.getElementById('count-anomalies').textContent = anomalies.length;

  if (!anomalies.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>Aucune anomalie signalée</div>';
    return;
  }

  const sorted = [...anomalies].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

  el.innerHTML = sorted.map(a => {
    const lbl = ANOMALY_LABELS[a.anomalieType] || '⚠️ Anomalie';
    const comment = a.commentaire ? `<div class="anomalie-comment">💬 ${a.commentaire}</div>` : '';
    return `
      <div class="anomalie-row">
        <div class="anomalie-icon">⚠️</div>
        <div class="anomalie-info">
          <div class="anomalie-adresse">${a.adresse || '—'}</div>
          <div class="anomalie-meta">${a.agent} · ${a.tourneeId} · <strong>${lbl}</strong></div>
          ${comment}
        </div>
        <div class="anomalie-time">${fmt(a.timestamp)}</div>
      </div>`;
  }).join('');
}

function renderHistorique(sessions, validations) {
  const tbody = document.getElementById('histo-body');
  if (!sessions.length) {
    tbody.innerHTML = '<tr><td colspan="9"><div class="empty"><div class="empty-icon">📋</div>Aucune donnée pour cette période</div></td></tr>';
    return;
  }
  const sorted = [...sessions].sort((a, b) => new Date(b.startTime) - new Date(a.startTime));
  tbody.innerHTML = sorted.map(s => {
    const vals = validations.filter(v => v.agent === s.agent && v.tourneeId === s.tourneeId && v.startTime === s.startTime);
    const dureeMs = s.endTime ? new Date(s.endTime) - new Date(s.startTime) : null;
    const anomCount = vals.filter(v => v.anomalie).length;
    const badge = s.status === 'terminee'
      ? `<span class="badge badge-terminee">✓ Terminée</span>`
      : `<span class="badge badge-en-cours">⏳ En cours</span>`;
    return `
      <tr>
        <td><strong>${s.agent}</strong></td>
        <td>${s.tourneeId}</td>
        <td>${fmtDate(s.startTime)}</td>
        <td>${fmt(s.startTime)}</td>
        <td>${s.endTime ? fmt(s.endTime) : '—'}</td>
        <td class="duration">${fmtDuree(dureeMs)}</td>
        <td>${vals.length}</td>
        <td>${anomCount > 0 ? `<span style="color:var(--red);font-weight:700;">⚠️ ${anomCount}</span>` : '<span style="color:#1b5e20;">0</span>'}</td>
        <td>${badge}</td>
      </tr>`;
  }).join('');
}

// ─── EXPORT EXCEL ───
function exportExcel() {
  const date = document.getElementById('filter-date').value;
  const url = '/api/export/excel' + (date ? `?date=${date}` : '');
  window.location.href = url;
  showToast('📥 Export Excel en cours…');
}

// ─── EXPORT PDF ───
function exportPDF() {
  showToast('📄 Génération du PDF…');
  setTimeout(() => window.print(), 300);
}

// ─── INIT ───
// Date du jour par défaut
const today = new Date().toISOString().split('T')[0];
document.getElementById('filter-date').value = today;

// Chargement initial
loadDashboard();

// Actualisation automatique toutes les 30 secondes
setInterval(loadDashboard, 30000);
</script>
</body>
</html>
