<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1a3a5c">
<title>SorteurPro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --blue: #1a3a5c;
    --blue-mid: #2e6da4;
    --blue-light: #d6e4f0;
    --green: #155724;
    --green-bg: #d4edda;
    --green-border: #c3e6cb;
    --red: #7d1f1f;
    --orange: #7d3c00;
    --orange-bg: #fff8f0;
    --orange-border: #f0c080;
    --gray-bg: #f5f5f5;
    --gray-border: #e0e0e0;
    --text: #1a1a1a;
    --text-muted: #666;
    --radius: 10px;
    --radius-lg: 14px;
  }

  html, body { height: 100%; background: #f0f2f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: var(--text); }

  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #f0f2f5; display: flex; flex-direction: column; }

  /* ─── HEADER ─── */
  .app-header {
    background: var(--blue); color: white;
    padding: 14px 16px 12px;
    display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 10;
  }
  .app-header .logo { font-size: 24px; }
  .app-header h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.2px; }
  .app-header .sub { font-size: 11px; opacity: 0.65; margin-top: 1px; }
  .back-btn { background: none; border: none; color: white; font-size: 22px; padding: 0 6px 0 0; cursor: pointer; opacity: 0.8; line-height: 1; }

  /* ─── SCREENS ─── */
  .screen { display: none; flex: 1; padding: 16px; }
  .screen.active { display: block; }

  /* ─── FORM ─── */
  label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 5px; margin-top: 14px; }
  input[type=text], select {
    width: 100%; font-size: 16px; border-radius: var(--radius);
    border: 1px solid var(--gray-border); padding: 11px 14px;
    background: white; color: var(--text); appearance: none;
    -webkit-appearance: none;
  }
  input[type=text]:focus, select:focus { outline: none; border-color: var(--blue-mid); }
  textarea {
    width: 100%; font-size: 14px; border-radius: var(--radius);
    border: 1px solid var(--orange-border); padding: 10px 12px;
    background: white; color: var(--text); min-height: 80px; resize: vertical;
    font-family: inherit;
  }
  textarea:focus { outline: none; border-color: var(--red); }

  /* ─── BUTTONS ─── */
  .btn-primary {
    background: var(--blue); color: white; border: none;
    border-radius: var(--radius); padding: 14px;
    font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 20px;
    transition: opacity 0.15s; letter-spacing: 0.2px;
  }
  .btn-primary:active { opacity: 0.8; }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ─── PROGRESS ─── */
  .progress-wrap { margin: 0 0 16px; }
  .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .progress-label { font-size: 12px; color: var(--text-muted); }
  .progress-bar { background: var(--gray-bg); border-radius: 99px; height: 7px; overflow: hidden; }
  .progress-fill { background: var(--blue); height: 100%; border-radius: 99px; transition: width 0.4s ease; }

  /* ─── INFO ROW ─── */
  .info-row {
    display: flex; align-items: center; gap: 8px;
    background: white; border: 1px solid var(--gray-border);
    border-radius: var(--radius); padding: 10px 14px;
    margin-bottom: 10px; font-size: 13px; color: var(--text-muted);
  }
  .info-row .val { font-weight: 600; margin-left: auto; color: var(--text); font-size: 14px; }

  /* ─── ADDRESS CARDS ─── */
  .addr-card {
    background: white; border: 1px solid var(--gray-border);
    border-radius: var(--radius-lg); padding: 14px 14px;
    margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
    transition: border-color 0.15s, opacity 0.15s;
  }
  .addr-card.clickable { cursor: pointer; }
  .addr-card.clickable:active { opacity: 0.85; }
  .addr-card.done { opacity: 0.55; }
  .addr-card.locked { opacity: 0.38; }
  .addr-card.active-card { border-color: var(--blue); border-width: 2px; }

  .step-badge {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    background: var(--gray-bg); color: var(--text-muted);
    border: 1px solid var(--gray-border);
  }
  .step-badge.done { background: var(--green-bg); color: var(--green); border-color: var(--green-border); }
  .step-badge.active { background: var(--blue); color: white; border-color: var(--blue); }

  .addr-info { flex: 1; min-width: 0; }
  .addr-name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .addr-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .addr-time { font-size: 11px; color: var(--blue-mid); margin-top: 4px; font-weight: 500; }
  .addr-anomaly { font-size: 11px; color: #8a4a00; margin-top: 3px; font-weight: 500; }
  .addr-icon { font-size: 20px; flex-shrink: 0; }

  /* ─── ACTION SCREEN ─── */
  .action-center { text-align: center; padding: 8px 0; }
  .action-pin { font-size: 44px; margin-bottom: 8px; }
  .action-addr { font-size: 20px; font-weight: 700; color: var(--blue); line-height: 1.25; margin-bottom: 4px; }
  .action-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn-ok, .btn-ko {
    border: none; border-radius: var(--radius-lg); padding: 20px 10px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-ok:active, .btn-ko:active { transform: scale(0.97); opacity: 0.85; }
  .btn-ok { background: #1b5e20; color: white; }
  .btn-ko { background: var(--red); color: white; }
  .btn-ok .bico, .btn-ko .bico { font-size: 30px; }
  .btn-ok .blbl, .btn-ko .blbl { font-size: 16px; }
  .btn-ok .bsub, .btn-ko .bsub { font-size: 11px; opacity: 0.75; font-weight: 400; }

  /* ─── ANOMALY PANEL ─── */
  .anomaly-panel {
    display: none; margin-top: 14px;
    background: var(--orange-bg); border: 1px solid var(--orange-border);
    border-radius: var(--radius-lg); padding: 14px;
  }
  .anomaly-panel.visible { display: block; }
  .anomaly-panel label { color: var(--orange); font-weight: 600; margin-top: 0; }
  .anomaly-panel label:not(:first-child) { margin-top: 12px; }

  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .chip {
    padding: 10px 8px; font-size: 12px; border-radius: var(--radius);
    border: 1px solid var(--orange-border); background: white;
    cursor: pointer; text-align: center; font-weight: 600;
    color: var(--orange); transition: background 0.1s; line-height: 1.3;
  }
  .chip:active { opacity: 0.8; }
  .chip.selected { background: var(--red); color: white; border-color: var(--red); }

  .btn-confirm-ko {
    background: var(--red); color: white; border: none;
    border-radius: var(--radius); padding: 12px; font-size: 15px;
    font-weight: 700; cursor: pointer; width: 100%; margin-top: 12px;
    transition: opacity 0.15s;
  }
  .btn-confirm-ko:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-confirm-ko:active { opacity: 0.8; }

  /* ─── FINISH ─── */
  .finish-hero { text-align: center; padding: 16px 0 20px; }
  .finish-icon { font-size: 56px; margin-bottom: 10px; }
  .finish-title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .finish-date { font-size: 13px; color: var(--text-muted); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  .stat-card { background: white; border: 1px solid var(--gray-border); border-radius: var(--radius-lg); padding: 14px; text-align: center; }
  .stat-val { font-size: 28px; font-weight: 700; color: var(--blue); }
  .stat-lbl { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  .section-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin: 16px 0 8px; }

  .detail-row { display: flex; align-items: flex-start; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--gray-bg); }
  .detail-num { font-size: 12px; color: var(--text-muted); min-width: 20px; padding-top: 1px; }
  .detail-info { flex: 1; }
  .detail-name { font-size: 13px; font-weight: 600; }
  .detail-time { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .detail-comment { font-size: 11px; color: #8a4a00; margin-top: 2px; }
  .badge { display: inline-flex; align-items: center; font-size: 11px; padding: 3px 9px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
  .badge-ok { background: var(--green-bg); color: var(--green); }
  .badge-ko { background: #f8d7da; color: #721c24; }

  /* ─── LOADING ─── */
  .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; }
  .spinner { width: 40px; height: 40px; border: 3px solid var(--gray-border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: var(--text-muted); }

  .error-msg { color: #721c24; font-size: 13px; margin-top: 8px; display: none; background: #f8d7da; padding: 10px 12px; border-radius: var(--radius); }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER (mis à jour par JS) -->
  <div class="app-header" id="app-header">
    <span class="logo">🗑️</span>
    <div>
      <h1>SorteurPro</h1>
      <div class="sub" id="header-sub">Gestion des tournées</div>
    </div>
  </div>

  <!-- ══ ÉCRAN CONNEXION ══ -->
  <div id="screen-login" class="screen active">
    <div class="loading-screen" id="loading-tournees" style="display:none;">
      <div class="spinner"></div>
      <div class="loading-text">Chargement des tournées…</div>
    </div>

    <div id="login-form">
      <label>Prénom</label>
      <input type="text" id="inp-prenom" placeholder="Ex : Jean" autocomplete="given-name">
      <label>Nom</label>
      <input type="text" id="inp-nom" placeholder="Ex : Dupont" autocomplete="family-name">
      <label>Numéro de tournée</label>
      <select id="sel-tournee">
        <option value="">— Chargement… —</option>
      </select>
      <div class="error-msg" id="login-error">Veuillez remplir tous les champs.</div>
      <button class="btn-primary" onclick="startTournee()">Démarrer la tournée →</button>
    </div>
  </div>

  <!-- ══ ÉCRAN LISTE ══ -->
  <div id="screen-list" class="screen">
    <div class="info-row">
      <span>⏱</span> Début de tournée
      <span class="val" id="list-start-time">—</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-header">
        <span class="progress-label" id="list-section-title">Adresses à traiter</span>
        <span class="progress-label" id="list-progress-label">0 / 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div id="address-list"></div>
  </div>

  <!-- ══ ÉCRAN ACTION ══ -->
  <div id="screen-action" class="screen">
    <div class="action-center">
      <div class="action-pin">📍</div>
      <div class="action-addr" id="action-addr-name"></div>
      <div class="action-sub" id="action-addr-sub"></div>
      <div class="btn-grid">
        <button class="btn-ok" onclick="validateAddr(false)">
          <span class="bico">✅</span>
          <span class="blbl">OK</span>
          <span class="bsub">Collecte effectuée</span>
        </button>
        <button class="btn-ko" onclick="toggleAnomalyPanel()">
          <span class="bico">⚠️</span>
          <span class="blbl">Anomalie</span>
          <span class="bsub">Signaler un problème</span>
        </button>
      </div>

      <div class="anomaly-panel" id="anomaly-panel">
        <label>Type d'anomalie *</label>
        <div class="chips" id="anomaly-chips"></div>
        <label>Commentaire complémentaire (optionnel)</label>
        <textarea id="anomaly-text" placeholder="Précisez si nécessaire…"></textarea>
        <button class="btn-confirm-ko" id="btn-confirm-ko" onclick="validateAddr(true)" disabled>
          Confirmer l'anomalie et continuer →
        </button>
      </div>
    </div>
  </div>

  <!-- ══ ÉCRAN FIN ══ -->
  <div id="screen-finish" class="screen">
    <div class="finish-hero">
      <div class="finish-icon">🎉</div>
      <div class="finish-title">Circuit complété !</div>
      <div class="finish-date" id="finish-date"></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-val" id="stat-total">—</div><div class="stat-lbl">Adresses traitées</div></div>
      <div class="stat-card"><div class="stat-val" id="stat-duree">—</div><div class="stat-lbl">Durée totale</div></div>
      <div class="stat-card"><div class="stat-val" id="stat-ok">—</div><div class="stat-lbl">Sans anomalie</div></div>
      <div class="stat-card"><div class="stat-val" id="stat-ko">—</div><div class="stat-lbl">Anomalies</div></div>
    </div>
    <div class="section-title">Détail des validations</div>
    <div id="finish-detail"></div>
    <button class="btn-primary" onclick="newTournee()" style="margin-top:20px;">Nouvelle tournée</button>
  </div>

</div><!-- .app -->

<script>
// ═══════════════════════════════════════════
//  CONFIGURATION
// ═══════════════════════════════════════════
const ANOMALY_TYPES = [
  { id: "bac_absent",       label: "🗑️ Bac non sorti" },
  { id: "acces_bloque",     label: "🚧 Accès bloqué" },
  { id: "bac_endommage",    label: "🔨 Bac endommagé" },
  { id: "bac_plein",        label: "🔴 Bac trop plein" },
  { id: "mauvais_tri",      label: "♻️ Mauvais tri" },
  { id: "bac_non_rentre",   label: "↩️ Non rentré (AM)" },
  { id: "adresse_absente",  label: "❓ Adresse introuvable" },
  { id: "autre",            label: "📝 Autre" },
];

// ═══════════════════════════════════════════
//  ÉTAT
// ═══════════════════════════════════════════
let TOURNEES = {};
let session = {
  agent: "", tourneeId: "", tourneeData: null,
  startTime: null, endTime: null, currentIdx: 0, results: []
};
let selectedAnomalyId = null;

// ═══════════════════════════════════════════
//  CHARGEMENT DES TOURNÉES DEPUIS LE SERVEUR
// ═══════════════════════════════════════════
async function loadTournees() {
  document.getElementById('loading-tournees').style.display = 'flex';
  document.getElementById('login-form').style.display = 'none';

  try {
    const res = await fetch('/api/tournees');
    if (!res.ok) throw new Error('Erreur serveur');
    TOURNEES = await res.json();

    const sel = document.getElementById('sel-tournee');
    sel.innerHTML = '<option value="">— Choisir une tournée —</option>';
    Object.entries(TOURNEES).forEach(([id, t]) => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = t.label || id;
      sel.appendChild(opt);
    });
  } catch(e) {
    // Fallback données d'exemple si le serveur est indisponible
    TOURNEES = {
      T1: { label: "Tournée 1 — OM Lundi", addresses: [
        { name: "36 rue de la Paix", sub: "Résidence Les Acacias — 12 bacs OM" },
        { name: "12 avenue du Général de Gaulle", sub: "Immeuble Horizon — 8 bacs OM" },
        { name: "5 boulevard Victor Hugo", sub: "Copropriété Le Cèdre — 6 bacs OM" },
      ]}
    };
    const sel = document.getElementById('sel-tournee');
    sel.innerHTML = '<option value="">— Choisir une tournée —</option>';
    Object.entries(TOURNEES).forEach(([id, t]) => {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = t.label || id;
      sel.appendChild(opt);
    });
    console.warn('Serveur inaccessible, données de démonstration chargées.');
  }

  document.getElementById('loading-tournees').style.display = 'none';
  document.getElementById('login-form').style.display = 'block';
}

// ═══════════════════════════════════════════
//  NAVIGATION
// ═══════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setHeader(title, sub, showBack, backFn) {
  const hdr = document.getElementById('app-header');
  hdr.innerHTML = '';

  if (showBack) {
    const btn = document.createElement('button');
    btn.className = 'back-btn';
    btn.textContent = '‹';
    btn.onclick = backFn;
    hdr.appendChild(btn);
  } else {
    const logo = document.createElement('span');
    logo.className = 'logo';
    logo.textContent = '🗑️';
    hdr.appendChild(logo);
  }

  const div = document.createElement('div');
  div.innerHTML = `<h1>${title}</h1><div class="sub">${sub}</div>`;
  hdr.appendChild(div);
}

// ═══════════════════════════════════════════
//  UTILITAIRES
// ═══════════════════════════════════════════
function fmt(dt) {
  if (!dt) return '—';
  return new Date(dt).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function fmtDuree(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  if (h > 0) return `${h}h ${m % 60}min`;
  return `${m}min ${s % 60}s`;
}
function anomalyLabel(id) {
  const a = ANOMALY_TYPES.find(x => x.id === id);
  return a ? a.label : 'Anomalie';
}

// ═══════════════════════════════════════════
//  DÉMARRAGE TOURNÉE
// ═══════════════════════════════════════════
function startTournee() {
  const prenom = document.getElementById('inp-prenom').value.trim();
  const nom    = document.getElementById('inp-nom').value.trim();
  const tid    = document.getElementById('sel-tournee').value;
  const err    = document.getElementById('login-error');

  if (!prenom || !nom || !tid) { err.style.display = 'block'; return; }
  err.style.display = 'none';

  session.agent      = `${prenom} ${nom}`;
  session.tourneeId  = tid;
  session.tourneeData = TOURNEES[tid];
  session.startTime  = new Date();
  session.currentIdx = 0;
  session.results    = session.tourneeData.addresses.map(() => null);

  setHeader(session.tourneeData.label, session.agent, false, null);
  document.getElementById('list-start-time').textContent = fmt(session.startTime);
  renderList();
  showScreen('screen-list');
}

// ═══════════════════════════════════════════
//  LISTE DES ADRESSES
// ═══════════════════════════════════════════
function renderList() {
  const addrs = session.tourneeData.addresses;
  const done  = session.results.filter(r => r !== null).length;

  document.getElementById('list-progress-label').textContent = `${done} / ${addrs.length}`;
  document.getElementById('prog-fill').style.width = `${Math.round(done / addrs.length * 100)}%`;

  const el = document.getElementById('address-list');
  el.innerHTML = '';

  addrs.forEach((addr, i) => {
    const res      = session.results[i];
    const isDone   = res !== null;
    const isActive = i === session.currentIdx && !isDone;
    const isLocked = i > session.currentIdx && !isDone;

    const card = document.createElement('div');
    card.className = `addr-card${isDone ? ' done' : ''}${isActive ? ' active-card clickable' : ''}${isLocked ? ' locked' : ''}${(!isDone && !isLocked && !isActive) ? '' : ''}`;
    if (isActive) card.onclick = () => openAction(i);

    // Badge numéro
    const badge = document.createElement('div');
    badge.className = `step-badge${isDone ? ' done' : isActive ? ' active' : ''}`;
    badge.textContent = isDone ? '✓' : (i + 1);

    // Info
    const info = document.createElement('div');
    info.className = 'addr-info';
    info.innerHTML = `<div class="addr-name">${addr.name}</div><div class="addr-sub">${addr.sub || ''}</div>`;

    if (isDone) {
      const timeEl = document.createElement('div');
      timeEl.className = 'addr-time';
      timeEl.textContent = '⏱ ' + fmt(res.timestamp);
      info.appendChild(timeEl);

      if (res.anomalie) {
        const anomEl = document.createElement('div');
        anomEl.className = 'addr-anomaly';
        const lbl = anomalyLabel(res.anomalieType);
        anomEl.textContent = '⚠️ ' + lbl + (res.commentaire ? ' — ' + res.commentaire : '');
        info.appendChild(anomEl);
      }
    }

    // Icône statut
    const icon = document.createElement('div');
    icon.className = 'addr-icon';
    if (isDone && res.anomalie) icon.textContent = '⚠️';
    else if (isDone) icon.textContent = '✅';
    else if (isActive) icon.textContent = '👉';
    else icon.textContent = '⏳';
    if (isLocked) icon.style.opacity = '0.3';

    card.appendChild(badge);
    card.appendChild(info);
    card.appendChild(icon);
    el.appendChild(card);
  });

  if (done === addrs.length) setTimeout(showFinish, 500);
}

// ═══════════════════════════════════════════
//  ÉCRAN ACTION
// ═══════════════════════════════════════════
function openAction(idx) {
  session.currentIdx = idx;
  const addr = session.tourneeData.addresses[idx];

  setHeader(
    `Adresse ${idx + 1} / ${session.tourneeData.addresses.length}`,
    session.tourneeData.label,
    true,
    () => { setHeader(session.tourneeData.label, session.agent, false, null); renderList(); showScreen('screen-list'); }
  );

  document.getElementById('action-addr-name').textContent = addr.name;
  document.getElementById('action-addr-sub').textContent  = addr.sub || '';

  // Reset panel anomalie
  document.getElementById('anomaly-panel').classList.remove('visible');
  document.getElementById('anomaly-text').value = '';
  buildChips();
  selectedAnomalyId = null;
  document.getElementById('btn-confirm-ko').disabled = true;

  showScreen('screen-action');
}

function buildChips() {
  const grid = document.getElementById('anomaly-chips');
  grid.innerHTML = '';
  ANOMALY_TYPES.forEach(a => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = a.label;
    chip.onclick = () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      selectedAnomalyId = a.id;
      document.getElementById('btn-confirm-ko').disabled = false;
    };
    grid.appendChild(chip);
  });
}

function toggleAnomalyPanel() {
  const panel = document.getElementById('anomaly-panel');
  const wasVisible = panel.classList.contains('visible');
  panel.classList.toggle('visible');
  if (!wasVisible) buildChips();
}

// ═══════════════════════════════════════════
//  VALIDATION D'UNE ADRESSE
// ═══════════════════════════════════════════
function validateAddr(isAnomalie) {
  if (isAnomalie && !selectedAnomalyId) return;

  const commentaire = document.getElementById('anomaly-text').value.trim();
  const result = {
    timestamp:    new Date().toISOString(),
    anomalie:     isAnomalie,
    anomalieType: isAnomalie ? selectedAnomalyId : null,
    commentaire:  commentaire
  };

  session.results[session.currentIdx] = result;

  // ── Envoi au serveur (silencieux si réseau absent) ──
  fetch('/api/validation', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      agent:        session.agent,
      tourneeId:    session.tourneeId,
      tourneeName:  session.tourneeData.label,
      adresseIndex: session.currentIdx,
      adresse:      session.tourneeData.addresses[session.currentIdx].name,
      anomalie:     isAnomalie,
      anomalieType: isAnomalie ? selectedAnomalyId : null,
      commentaire:  commentaire,
      timestamp:    result.timestamp,
      startTime:    session.startTime.toISOString()
    })
  }).catch(() => {});

  // Avance au suivant
  if (session.currentIdx + 1 < session.tourneeData.addresses.length) {
    session.currentIdx++;
  }

  // Retour à la liste
  setHeader(session.tourneeData.label, session.agent, false, null);
  renderList();
  showScreen('screen-list');
}

// ═══════════════════════════════════════════
//  ÉCRAN FIN DE TOURNÉE
// ═══════════════════════════════════════════
function showFinish() {
  session.endTime = new Date();
  const addrs     = session.tourneeData.addresses;
  const duree     = session.endTime - session.startTime;
  const anomalies = session.results.filter(r => r && r.anomalie).length;

  setHeader('Tournée terminée', session.agent, false, null);

  document.getElementById('finish-date').textContent =
    session.endTime.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) +
    ' · Début ' + fmt(session.startTime) + ' · Fin ' + fmt(session.endTime);

  document.getElementById('stat-total').textContent = addrs.length;
  document.getElementById('stat-duree').textContent = fmtDuree(duree);
  document.getElementById('stat-ok').textContent    = addrs.length - anomalies;
  document.getElementById('stat-ko').textContent    = anomalies;

  // Envoi récapitulatif de fin de tournée
  fetch('/api/validation', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      type:      'fin_tournee',
      agent:     session.agent,
      tourneeId: session.tourneeId,
      startTime: session.startTime.toISOString(),
      endTime:   session.endTime.toISOString(),
      dureeMs:   duree,
      total:     addrs.length,
      anomalies: anomalies,
      timestamp: session.endTime.toISOString()
    })
  }).catch(() => {});

  // Détail
  const detail = document.getElementById('finish-detail');
  detail.innerHTML = '';
  addrs.forEach((addr, i) => {
    const res = session.results[i];
    if (!res) return;
    const row = document.createElement('div');
    row.className = 'detail-row';

    const lbl = res.anomalie ? anomalyLabel(res.anomalieType) : '';
    const badge = res.anomalie
      ? `<span class="badge badge-ko">⚠️ ${lbl}</span>`
      : `<span class="badge badge-ok">✅ OK</span>`;
    const comment = res.commentaire
      ? `<div class="detail-comment">${res.commentaire}</div>` : '';

    row.innerHTML = `
      <div class="detail-num">${i + 1}.</div>
      <div class="detail-info">
        <div class="detail-name">${addr.name}</div>
        <div class="detail-time">${fmt(res.timestamp)}</div>
        ${comment}
      </div>
      ${badge}
    `;
    detail.appendChild(row);
  });

  showScreen('screen-finish');
}

// ═══════════════════════════════════════════
//  NOUVELLE TOURNÉE
// ═══════════════════════════════════════════
function newTournee() {
  session = { agent: '', tourneeId: '', tourneeData: null, startTime: null, endTime: null, currentIdx: 0, results: [] };
  setHeader('SorteurPro', 'Gestion des tournées', false, null);
  showScreen('screen-login');
}

// ═══════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════
loadTournees();
</script>
